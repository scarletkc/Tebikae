name: Check
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every browser suite before deployment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.browsers.outputs.matrix }}
      documentation_only: ${{ steps.browsers.outputs.documentation_only }}
      run_browsers: ${{ steps.browsers.outputs.run_browsers }}
      full: ${{ steps.browsers.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: browsers
        run: node scripts/ci-browser-plan.mjs
        env:
          FULL_BROWSER_SUITE: ${{ inputs.full || false }}
  validate:
    needs: plan
    if: needs.plan.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:hooks
      - run: pnpm check:ui
      - run: pnpm format:check
      - run: node --test tests/ci/*.test.mjs
      - run: pnpm test
      - run: pnpm exec vite build
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec vite build --outDir .artifacts/pages-dist
        if: needs.plan.outputs.run_browsers == 'true'
        env:
          VITE_BASE_PATH: /Tebikae/
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.run_browsers == 'true'
        with:
          name: browser-builds
          include-hidden-files: true
          path: |
            dist/
            .artifacts/pages-dist/
          retention-days: 1
  browsers:
    needs: [plan, validate]
    if: needs.plan.outputs.run_browsers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: browser (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identify browser cache
        id: playwright
        run: |
          node -e 'console.log("version=" + require("@playwright/test/package.json").version)' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps "$BROWSER"
        if: steps.browser-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ matrix.browser }}
      - run: pnpm exec playwright install-deps "$BROWSER"
        if: steps.browser-cache.outputs.cache-hit == 'true'
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        if: matrix.pwa
        with:
          name: browser-builds
      - run: pnpm test:e2e --project="$BROWSER" --grep="$TEST_GREP"
        env:
          BROWSER: ${{ matrix.browser }}
          TEST_GREP: ${{ matrix.grep }}
      - run: pnpm test:pwa --project="pwa-$BROWSER" --project="pages-$BROWSER"
        if: matrix.pwa
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.browser }}
          include-hidden-files: true
          path: |
            playwright-report/
            .artifacts/pwa-report/
  check:
    if: always()
    needs: [plan, validate, browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require all selected checks to pass
        env:
          PLAN: ${{ needs.plan.result }}
          VALIDATE: ${{ needs.validate.result }}
          BROWSERS: ${{ needs.browsers.result }}
          DOCUMENTATION_ONLY: ${{ needs.plan.outputs.documentation_only }}
          RUN_BROWSERS: ${{ needs.plan.outputs.run_browsers }}
        run: node scripts/ci-check-result.mjs
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.full == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: browser-builds
      - name: Record full verification
        if: needs.plan.outputs.full == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/ci-verified-build.mjs record
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.full == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: verified-browser-builds
          overwrite: true
          include-hidden-files: true
          path: |
            browser-verification.json
            dist/
            .artifacts/pages-dist/
          retention-days: 7
