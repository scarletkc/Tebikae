name: Check
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every browser suite before deployment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Let a code run finish so subsequent documentation commits can reuse its result.
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.browsers.outputs.matrix }}
      cache_key: ${{ steps.browsers.outputs.cache_key }}
      reuse_allowed: ${{ steps.browsers.outputs.reuse_allowed }}
      reused: ${{ steps.previous.outputs.cache-hit == 'true' }}
      documentation_only: ${{ steps.browsers.outputs.documentation_only }}
      run_checks: ${{ steps.browsers.outputs.documentation_only != 'true' && steps.previous.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: browsers
        run: node scripts/ci-browser-plan.mjs
        env:
          FULL_BROWSER_SUITE: ${{ inputs.full || false }}
      - uses: actions/cache/restore@v4
        id: previous
        if: steps.browsers.outputs.reuse_allowed == 'true'
        with:
          path: .ci-check/passed
          key: ${{ steps.browsers.outputs.cache_key }}
      - name: Explain reused verification
        if: steps.previous.outputs.cache-hit == 'true'
        run: |
          echo 'Code, base, coverage and runner match a successful verification. Current formatting must still pass.' >> "$GITHUB_STEP_SUMMARY"
          cat .ci-check/passed >> "$GITHUB_STEP_SUMMARY"
  validate:
    needs: plan
    if: needs.plan.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        if: needs.plan.outputs.run_checks == 'true'
      - run: pnpm lint
        if: needs.plan.outputs.run_checks == 'true'
      - run: pnpm check:hooks
        if: needs.plan.outputs.run_checks == 'true'
      - run: pnpm check:ui
        if: needs.plan.outputs.run_checks == 'true'
      - run: pnpm format:check
      - run: node --test tests/ci/*.test.mjs
        if: needs.plan.outputs.run_checks == 'true'
      - run: pnpm test
        if: needs.plan.outputs.run_checks == 'true'
      - run: pnpm build
        if: needs.plan.outputs.run_checks == 'true'
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec vite build --outDir .artifacts/pages-dist
        if: needs.plan.outputs.run_checks == 'true'
        env:
          VITE_BASE_PATH: /Tebikae/
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.run_checks == 'true'
        with:
          name: browser-builds
          include-hidden-files: true
          path: |
            dist/
            .artifacts/pages-dist/
          retention-days: 1
  browsers:
    needs: [plan, validate]
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: browser (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identify browser cache
        id: playwright
        run: |
          node -e 'console.log("version=" + require("@playwright/test/package.json").version)' >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps "$BROWSER"
        if: steps.browser-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ matrix.browser }}
      - run: pnpm exec playwright install-deps "$BROWSER"
        if: steps.browser-cache.outputs.cache-hit == 'true'
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        if: matrix.pwa
        with:
          name: browser-builds
      - run: pnpm test:e2e --project="$BROWSER" --grep="$TEST_GREP"
        env:
          BROWSER: ${{ matrix.browser }}
          TEST_GREP: ${{ matrix.grep }}
      - run: pnpm test:pwa --project="pwa-$BROWSER" --project="pages-$BROWSER"
        if: matrix.pwa
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.browser }}
          include-hidden-files: true
          path: |
            playwright-report/
            .artifacts/pwa-report/
  check:
    if: always()
    needs: [plan, validate, browsers]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          PLAN: ${{ needs.plan.result }}
          VALIDATE: ${{ needs.validate.result }}
          BROWSERS: ${{ needs.browsers.result }}
          REUSED: ${{ needs.plan.outputs.reused }}
          DOCUMENTATION_ONLY: ${{ needs.plan.outputs.documentation_only }}
        run: |
          test "$PLAN" = success
          if [ "$DOCUMENTATION_ONLY" = true ]; then
            test "$VALIDATE" = skipped
            test "$BROWSERS" = skipped
            echo 'Documentation-only PR: code validation is not required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$VALIDATE" = success
          if [ "$REUSED" = true ]; then
            test "$BROWSERS" = skipped
          else
            test "$BROWSERS" = success
          fi
      - name: Record successful code verification
        if: needs.plan.outputs.reuse_allowed == 'true' && needs.plan.outputs.run_checks == 'true'
        run: |
          mkdir -p .ci-check
          printf 'Verified by %s/%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .ci-check/passed
      - uses: actions/cache/save@v4
        if: needs.plan.outputs.reuse_allowed == 'true' && needs.plan.outputs.run_checks == 'true'
        with:
          path: .ci-check/passed
          key: ${{ needs.plan.outputs.cache_key }}
